<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnet Radar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hotspot_radar.css') }}">
</head>
<body>

    <nav class="navbar navbar-dark custom-navbar mb-4">
        <div class="container">
            <a href="/" class="navbar-brand mb-0 h1" style="color: var(--accent-amber); font-weight: 700; letter-spacing: 1px;">
                <i class="fa-solid fa-network-wired me-2"></i> NETWORK RADAR
            </a>
            <div class="d-flex align-items-center">
                <button id="theme-toggle-btn" class="theme-toggle-btn me-2" type="button"
                        aria-label="Temayı değiştir" title="Açık / Koyu tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <div class="module-dropdown" id="moduleDropdown">
                <button class="module-dropdown-btn" onclick="toggleModuleMenu()">
                    <i class="fa-solid fa-th-large"></i>
                    MODULES
                    <i class="fa-solid fa-chevron-down chevron"></i>
                </button>
                <div class="module-dropdown-menu">
                    <div class="module-dropdown-header">Navigate to</div>
                    <a href="/" class="module-dropdown-item" data-module="home">
                        <span class="item-dot"></span>
                        <i class="fa-solid fa-house item-icon"></i>
                        Main Menu
                    </a>
                    <a href="/ip-scan" class="module-dropdown-item" data-module="ip">
                        <span class="item-dot"></span>
                        <i class="fa-solid fa-network-wired item-icon"></i>
                        IP Radar
                    </a>
                    <a href="/wifi-scan" class="module-dropdown-item" data-module="wifi">
                        <span class="item-dot"></span>
                        <i class="fa-solid fa-wifi item-icon"></i>
                        Wi-Fi Radar
                    </a>
                    <a href="/bluetooth-scan" class="module-dropdown-item" data-module="bluetooth">
                        <span class="item-dot"></span>
                        <i class="fa-brands fa-bluetooth-b item-icon"></i>
                        Bluetooth Radar
                    </a>
                    <a href="/internet-tools" class="module-dropdown-item" data-module="internet">
                        <span class="item-dot"></span>
                        <i class="fa-solid fa-globe item-icon"></i>
                        Internet Tools
                    </a>
                    <a href="/speed-test" class="module-dropdown-item" data-module="speed">
                        <span class="item-dot"></span>
                        <i class="fa-solid fa-gauge-high item-icon"></i>
                        Speed Test
                    </a>
                    <a href="/topology" class="module-dropdown-item" data-module="topology">
                        <span class="item-dot"></span>
                        <i class="fa-solid fa-diagram-project item-icon"></i>
                        Topology
                    </a>
                    <a href="/hotspot-radar" class="module-dropdown-item active" data-module="hotspot">
                        <span class="item-dot"></span>
                        <i class="fa-solid fa-tower-broadcast item-icon"></i>
                        Hotspot Radar
                    </a>
                </div>
            </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h2 class="h4 mb-1 fw-bold" style="color: var(--text-primary);">Hotspot Client Radar</h2>
                <span class="text-warning small">
                    <i class="fa-solid fa-tower-broadcast me-1"></i> Devices connected to your PC's Mobile Hotspot
                </span>
            </div>
            <div class="d-flex gap-2 align-items-center flex-wrap">
                <button id="refreshBtn" class="btn btn-sm btn-scan-hotspot fw-bold">
                    <i class="fa-solid fa-rotate me-1"></i> REFRESH
                </button>
            </div>
        </div>

        <div class="main-card">
            <div id="statusBanner" class="status-banner mb-3">Scanning...</div>

            <div class="table-responsive">
                <table class="table align-middle hotspot-table" id="hotspotTable" style="display:none;">
                    <thead>
                        <tr>
                            <th style="width:5%">#</th>
                            <th style="width:25%"><i class="fa-solid fa-network-wired me-1"></i> IP Address</th>
                            <th style="width:30%"><i class="fa-solid fa-tag me-1"></i> Hostname</th>
                            <th style="width:25%"><i class="fa-solid fa-fingerprint me-1"></i> MAC Address</th>
                            <th style="width:15%"><i class="fa-solid fa-microchip me-1"></i> Vendor</th>
                        </tr>
                    </thead>
                    <tbody id="hotspotTableBody"></tbody>
                </table>
            </div>
    </div>

    <script src="{{ url_for('static', filename='js/hotspot_radar.js') }}"></script>
    <script>
        function toggleModuleMenu() {
            document.getElementById('moduleDropdown').classList.toggle('open');
        }
        document.addEventListener('click', function(e) {
            const dd = document.getElementById('moduleDropdown');
            if (dd && !dd.contains(e.target)) dd.classList.remove('open');
        });
    </script>
</body>
</html>
